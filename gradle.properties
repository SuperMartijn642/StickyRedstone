# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

# Minecraft
minecraft_version=26.1.2
minecraft_dependency=[26.1,26.2)
minecraft_suffix=mc26.1
java_target=25
java_dependency=>=25

# Forge
forge_version=64.0.8
forge_dependency=*
javafml_dependency=[1,)
net.minecraftforge.gradle.merge-source-sets=true

# Mixin
mixin_minimum_version=0.8
mixin_package=mixin
mixin_compatibility_level=JAVA_21

# Mod properties
mod_name=Sticky Redstone
mod_description=Adds redstone that can go on the side of blocks!
mod_id=stickyredstone
mod_version=1.0.0
mod_license=All rights reserved
mod_page=https://www.curseforge.com/minecraft/mc-mods/sticky-redstones
mod_sources=https://github.com/SuperMartijn642/StickyRedstone
mod_issues=https://github.com/SuperMartijn642/StickyRedstone/issues
mod_package=com.supermartijn642.stickyredstone
mod_main_class=StickyRedstone
mod_client_class=StickyRedstoneClient
maven_group=com.supermartijn642

# Publishing
publishing_release_type=stable
publishing_game_versions=26.1 26.1.1 26.1.2
curseforge_project_id=1641918
curseforge_required_dependency_ids=supermartijn642s-core-lib
curseforge_optional_dependency_ids=
modrinth_project_id=1rA9AFJ9
modrinth_required_dependency_ids=supermartijn642s-core-lib
modrinth_optional_dependency_ids=

# Dependencies
core_library_file=8526661
core_library_dependency=>=1.1.17 <1.2.0
config_library_file=8306873
config_library_dependency=>=1.1.6
